name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Acesse ...
        2. Clique em ...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit ou versão em produção
      description: SHA do deploy atual (aba Deployments) ou versão da release.
  - type: textarea
    id: logs
    attributes:
      label: Logs ou prints
      description: Remova qualquer dado sensível antes de colar.
      render: text
