# Build LOCAL/manual (docker compose up -d --build). Produção usa deploy/compose.prod.yml
# com imagens do GHCR publicadas pelo CD (ver docs/ci-cd.md).
services:
  # ─────────────────────────── API (NestJS) ───────────────────────────
  api:
    image: bl_atlas_stock-api
    build:
      context: ./backend
      target: runtime
    container_name: bl_g5-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./secrets/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
    networks:
      - mysql_shared
      - traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.g5_api.rule=(Host(`${DOMAIN}`) && PathPrefix(`/api`)) || Host(`api.${DOMAIN}`)"
      - traefik.http.routers.g5_api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.g5_api.tls=true
      - traefik.http.routers.g5_api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.g5_api.loadbalancer.server.port=3000
    mem_limit: 512m
    cpus: 0.75

  # ─────────────────────── Frontend (React/Vite) ──────────────────────
  app:
    image: bl_atlas_stock-app
    build:
      context: ./frontend
      target: runtime
      args:
        # O front chama /api relativo (Traefik roteia por path); sem URL no build.
        # Login demo: vazio por padrao (botao oculto). Qualquer valor aqui vai
        # para o JS publico; use SOMENTE uma conta sem privilegios.
        VITE_DEMO_ADMIN_EMAIL: ${VITE_DEMO_ADMIN_EMAIL:-}
        VITE_DEMO_ADMIN_PASSWORD: ${VITE_DEMO_ADMIN_PASSWORD:-}
    container_name: bl_g5-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.g5_web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.g5_web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.g5_web.tls=true
      - traefik.http.routers.g5_web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.g5_web.loadbalancer.server.port=8080
    mem_limit: 128m
    cpus: 0.25

  # ─────────────── Migrator one-off (Prisma migrate deploy) ────────────
  # Nao sobe com `up` (profile "tools"). Usa o target migrate do backend
  # (CLI do Prisma + schema + migrations). Roda manualmente:
  #   docker compose run --rm migrate
  migrate:
    image: bl_atlas_stock-migrate
    container_name: bl_g5-migrate
    build:
      context: ./backend
      target: migrate
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./secrets/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
    networks:
      - mysql_shared
    mem_limit: 512m
    cpus: 0.5

networks:
  mysql_shared:
    external: true
  traefik:
    external: true
